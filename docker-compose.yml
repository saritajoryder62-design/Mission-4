services:
  backend:
    build: ./Backend
    ports:
      - "5000:5000"   # your computer : container (the frontend calls localhost:5000)
    env_file:
      - ./Backend/.env

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    environment:
      # Vite passes /api requests to the backend container (see Frontend/vite.config.js)
      - API_TARGET=http://backend:5000
    depends_on:
      - backend
