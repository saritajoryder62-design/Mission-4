# .github/workflows/ci.yml
# Runs on every push and pull request to main, or by hand from the Actions tab:
#   1. Backend tests               – none yet: Backend has no "test" script, so this job runs no tests
#   2. Frontend tests (Playwright) – tests/test-tina.spec.js, Chromium only, Gemini is faked
#   3. Docker build                – proves both images still build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # same as the Dockerfiles

      - name: Install backend packages
        run: npm ci

      # --if-present = skip quietly if Backend/package.json has no "test" script yet
      - name: Run backend tests
        run: npm test --if-present
        env:
          GEMINI_API_KEY: fake-key-for-tests

  playwright-tests:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # same as the Dockerfiles

      # Playwright lives in the root Mission-4 folder
      - name: Install root packages (Playwright)
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install frontend packages
        run: npm ci
        working-directory: Frontend

      # Start the React app in the background, then wait until it answers
      - name: Start frontend
        run: npm run dev -- --port 5173 &
        working-directory: Frontend

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      # Keep the HTML report so you can download it from the Actions page
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, playwright-tests]   # only build if tests pass
    steps:
      - uses: actions/checkout@v4

      # Compose may expect a .env file; CI uses a fake key (we only build, not run)
      - name: Create fake .env for build
        run: echo "GEMINI_API_KEY=fake-key-for-ci" > Backend/.env

      - name: Build Docker images
        run: docker compose build